<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 西語小宇宙 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        /* 基礎共用樣式 */
        body {
            font-family: 'Nunito', 'Varela Round', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFF8D6;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #5D4037;
        }

        h1 { 
            font-weight: 900; color: #FF8BA7; 
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(255,139,167,0.2);
            margin-bottom: 25px; font-size: 32px; text-align: center;
        }

        /* 視圖容器：控制顯示與隱藏 */
        .view-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }
        .view-section.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 首頁樣式 */
        .home-btn {
            width: 100%; padding: 20px; margin-bottom: 20px;
            font-size: 24px; font-weight: 800; border-radius: 25px;
            cursor: pointer; border: 4px solid #FFF; transition: all 0.2s ease;
        }
        .home-btn-learn { background: #B5EAD7; color: #2C3E50; box-shadow: 0 8px 0px #82C28F; }
        .home-btn-quiz { background: #FFDAC1; color: #5D4037; box-shadow: 0 8px 0px #E5C3AB; }
        .home-btn:hover { transform: translateY(-3px); filter: brightness(1.05); }
        .home-btn:active { transform: translateY(8px); box-shadow: 0 0px 0px transparent; filter: brightness(0.95); }
        
        .home-mascot { font-size: 100px; margin: 30px 0; animation: bounceFloat 2s infinite ease-in-out; }
        @keyframes bounceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* 返回按鈕 (共用) */
        .back-btn {
            background: white; border: 2px solid #ddd; padding: 8px 15px;
            border-radius: 15px; font-weight: bold; cursor: pointer;
            margin-bottom: 20px; align-self: flex-start;
            box-shadow: 0 4px 0px #eee; color: #666; transition: all 0.2s ease;
        }
        .back-btn:hover { transform: translateY(-2px); background: #f9f9f9; }
        .back-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px transparent; }

        /* --- 小教室樣式 --- */
        .theme-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .theme-btn { background: #FFF; border: 3px solid #FFE082; color: #FFA000; padding: 8px 15px; border-radius: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0px #FFE082; transition: all 0.2s ease; }
        .theme-btn:hover:not(.active) { transform: translateY(-2px); background: #FFFdf5; }
        .theme-btn.active { background: #FFD54F; border-color: #FFCA28; color: #FFF; box-shadow: 0 4px 0px #FFB300; }
        .theme-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px transparent; }
        
        .card-container { width: 300px; height: 350px; perspective: 1000px; cursor: pointer; margin-bottom: 15px; transition: transform 0.3s ease; }
        .card-container:hover { transform: translateY(-5px); }
        
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border-radius: 35px; background-color: white; border: 4px solid #FFF; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .card-front { border-color: #B5EAD7; }
        .card-back { transform: rotateY(180deg); background-color: #B5EAD7; border-color: #FFF; }
        
        .card-emoji { font-size: 70px; margin-bottom: 10px; }
        .word-text { font-size: 36px; font-weight: 900; margin: 5px 0; color: #4A4A4A; }
        .pronunciation { font-size: 16px; color: #FF8BA7; font-weight: 800; background: #FFF0F3; padding: 5px 15px; border-radius: 20px; }
        .explanation { font-size: 14px; text-align: center; color: #666; margin-top: 15px; font-weight: 600; }

        .carousel-dots { display: flex; gap: 8px; margin-bottom: 20px; }
        .dot { width: 10px; height: 10px; background-color: #FFE082; border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .dot:hover:not(.active) { transform: scale(1.3); background-color: #FFCA28; }
        .dot.active { width: 20px; background-color: #FF8BA7; border-radius: 10px; }

        .controls-wrapper { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .navigation, .audio-controls { display: flex; gap: 10px; justify-content: center; }
        button.action-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: 800; cursor: pointer; border: none; border-radius: 15px; color: white; box-shadow: 0 4px 0px rgba(0,0,0,0.1); transition: all 0.2s ease; }
        button.action-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        button.action-btn:active { transform: translateY(4px) !important; box-shadow: 0 0px 0px transparent !important; filter: brightness(0.95); }
        
        .btn-prev { background: #C7CEEA; box-shadow: 0 4px 0px #A8B1D4; color: #4A4A4A;}
        .btn-next { background: #FFDAC1; box-shadow: 0 4px 0px #E5C3AB; color: #4A4A4A;}
        .btn-slow { background: #A0E8AF; box-shadow: 0 4px 0px #82C28F; color: #4A4A4A;}
        .btn-normal { background: #FFB7B2; box-shadow: 0 4px 0px #E09D98; color: white;}
        .btn-fast { background: #E2F0CB; box-shadow: 0 4px 0px #C5D4AF; color: #4A4A4A;}

        /* --- 小測驗樣式 --- */
        .quiz-card {
            background: white; width: 100%; border-radius: 25px; padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; box-sizing: border-box;
            border: 4px solid #FFDAC1;
        }
        .quiz-question { font-size: 20px; font-weight: 800; color: #666; margin-bottom: 10px; }
        .quiz-emoji { font-size: 60px; margin-bottom: 10px; }
        .quiz-target { font-size: 32px; font-weight: 900; color: #FF8BA7; margin-bottom: 25px; }
        
        .options-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .option-btn {
            background: #FFF0F3; border: 2px solid #FF8BA7; color: #5D4037;
            padding: 15px; border-radius: 15px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 0px #FF8BA7;
        }
        .option-btn:hover { transform: translateY(-2px); background: #FFE0E6; box-shadow: 0 6px 0px #FF8BA7; }
        .option-btn:active { transform: translateY(4px) !important; box-shadow: 0 0px 0px transparent !important; }
        .option-btn.correct { background: #A0E8AF; border-color: #82C28F; color: white; box-shadow: 0 4px 0px #82C28F; }
        .option-btn.wrong { background: #FFB7B2; border-color: #E09D98; color: white; box-shadow: 0 4px 0px #E09D98; }
        
        .score-board { font-size: 18px; font-weight: bold; color: #FFA000; margin-bottom: 15px; }

        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.3s ease forwards; }
        @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .animate-bounce { animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>

    <h1>🌟 西語小宇宙 🌟</h1>

    <div id="view-home" class="view-section active">
        <div class="home-mascot">🐣</div>
        <button class="home-btn home-btn-learn" onclick="switchView('view-classroom')">📖 進入小教室</button>
        <button class="home-btn home-btn-quiz" onclick="startQuiz()">🎮 開始小測驗</button>
    </div>

    <div id="view-classroom" class="view-section">
        <button class="back-btn" onclick="switchView('view-home')">🏠 回首頁</button>
        
        <div class="theme-buttons">
            <button class="theme-btn active" onclick="changeTheme('numbers', this)">🔢 數字</button>
            <button class="theme-btn" onclick="changeTheme('basics', this)">🗣️ 對話</button>
            <button class="theme-btn" onclick="changeTheme('daily', this)">🏠 日常</button>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div id="card-emoji" class="card-emoji animate-bounce"></div>
                    <div id="card-front-text" class="word-text animate-bounce"></div>
                    <div id="card-pronunciation" class="pronunciation animate-bounce"></div>
                    <div class="explanation" style="color:#aaa;">點擊翻轉看意思 🔄</div>
                </div>
                <div class="card-face card-back">
                    <div id="card-back-text" class="word-text"></div>
                    <div id="card-explanation" class="explanation"></div>
                </div>
            </div>
        </div>

        <div class="carousel-dots" id="dots-container"></div>

        <div class="controls-wrapper">
            <div class="navigation">
                <button class="action-btn btn-prev" onclick="prevCard()">⬅️ 上一個</button>
                <button class="action-btn btn-next" onclick="nextCard()">下一個 ➡️</button>
            </div>
            <div class="audio-controls">
                <button class="action-btn btn-slow" onclick="speak(0.5)">🐢 慢速</button>
                <button class="action-btn btn-normal" onclick="speak(1.0)">▶️ 正常</button>
                <button class="action-btn btn-fast" onclick="speak(1.5)">🐇 快速</button>
            </div>
        </div>
    </div>

    <div id="view-quiz" class="view-section">
        <button class="back-btn" onclick="switchView('view-home')">🏠 回首頁</button>
        <div class="score-board" id="quiz-score-board">分數: 0 / 5</div>
        <div class="quiz-card" id="quiz-container">
            <div class="quiz-question">請問這個意思的西班牙文是？</div>
            <div id="quiz-emoji" class="quiz-emoji animate-pop">❓</div>
            <div id="quiz-target" class="quiz-target animate-pop">準備中...</div>
            <div class="options-grid" id="quiz-options"></div>
        </div>
        <div class="quiz-card" id="quiz-result" style="display:none;">
            <div class="quiz-emoji">🎉</div>
            <div class="quiz-target" id="final-score-text">測驗完成！</div>
            <div class="explanation" style="margin-bottom:20px;">太厲害了！繼續保持學習喔！</div>
            <button class="home-btn home-btn-quiz" onclick="startQuiz()">🔄 再玩一次</button>
        </div>
    </div>

    <script>
        const vocabulary = {
            numbers: [
                { es: "Uno", zh: "一", emoji: "1️⃣", pron: "烏-諾", desc: "數字的最開端。" },
                { es: "Dos", zh: "二", emoji: "2️⃣", pron: "斗斯", desc: "發音時 o 的音要發飽滿。" },
                { es: "Tres", zh: "三", emoji: "3️⃣", pron: "德雷斯", desc: "注意 r 的輕微彈舌音喔！" },
                { es: "Cuatro", zh: "四", emoji: "4️⃣", pron: "瓜-德羅", desc: "發音像英文的 'qua' 開頭。" },
                { es: "Cinco", zh: "五", emoji: "5️⃣", pron: "辛-溝", desc: "在西班牙 ci 發音像 th，在拉美則是 s。" },
                { es: "Seis", zh: "六", emoji: "6️⃣", pron: "塞-伊斯", desc: "兩個母音 e 和 i 連在一起念。" }
            ],
            basics: [
                { es: "Hola", zh: "你好", emoji: "👋", pron: "歐-拉", desc: "西班牙文的 H 永遠不發音！" },
                { es: "Gracias", zh: "謝謝", emoji: "🙏", pron: "格拉-西亞斯", desc: "表達感謝的最常用語。" },
                { es: "Por favor", zh: "請", emoji: "🥺", pron: "波-發佛爾", desc: "請求別人幫忙時的禮貌用語。" },
                { es: "Perdón", zh: "抱歉", emoji: "🙇", pron: "貝爾-東", desc: "不小心撞到人時使用。" },
                { es: "Adiós", zh: "再見", emoji: "👋", pron: "阿-迪歐斯", desc: "正式的道別。" },
                { es: "Buenos días", zh: "早安", emoji: "☀️", pron: "布威諾斯-迪亞斯", desc: "早上打招呼用。" }
            ],
            daily: [
                { es: "Agua", zh: "水", emoji: "💧", pron: "阿-瓜", desc: "定冠詞是 el (el agua)。" },
                { es: "Comida", zh: "食物", emoji: "🍱", pron: "溝-米-達", desc: "泛指食物或午餐。" },
                { es: "Casa", zh: "房子 / 家", emoji: "🏠", pron: "嘎-薩", desc: "My house 叫做 Mi casa。" },
                { es: "Dinero", zh: "錢", emoji: "💰", pron: "低-內-羅", desc: "旅行非常重要的一個單字！" },
                { es: "Baño", zh: "洗手間", emoji: "🚽", pron: "巴-紐", desc: "ñ 發音像「紐」。" },
                { es: "Gato", zh: "貓咪", emoji: "🐱", pron: "嘎-豆", desc: "可愛的動物單字！" }
            ]
        };

        let allWordsPool = [];
        for (const theme in vocabulary) {
            allWordsPool = allWordsPool.concat(vocabulary[theme]);
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.speechSynthesis.cancel();
        }

        let currentTheme = 'numbers';
        let currentIndex = 0;

        function triggerAnimation(elementId) {
            const el = document.getElementById(elementId);
            el.classList.remove('animate-bounce');
            void el.offsetWidth; 
            el.classList.add('animate-bounce');
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = ''; 
            for (let i = 0; i < vocabulary[currentTheme].length; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === currentIndex) dot.classList.add('active');
                
                dot.onclick = (e) => { 
                    e.stopPropagation(); 
                    currentIndex = i; 
                    updateCardDisplay(); 
                    setTimeout(() => { speak(1.0); }, 150); 
                };
                dotsContainer.appendChild(dot);
            }
        }

        function updateCardDisplay() {
            const currentWord = vocabulary[currentTheme][currentIndex];
            document.getElementById('card-front-text').innerText = currentWord.es;
            document.getElementById('card-back-text').innerText = currentWord.zh;
            document.getElementById('card-emoji').innerText = currentWord.emoji;
            document.getElementById('card-pronunciation').innerText = currentWord.pron;
            document.getElementById('card-explanation').innerText = currentWord.desc;
            
            triggerAnimation('card-emoji');
            triggerAnimation('card-front-text');
            triggerAnimation('card-pronunciation');
            
            renderDots();
            document.getElementById('flashcard').classList.remove('is-flipped');
        }

        function flipCard() { document.getElementById('flashcard').classList.toggle('is-flipped'); }

        // ⭐ 這裡加入了切換主題時自動發音的魔法
        function changeTheme(themeName, btnElement) {
            currentTheme = themeName; 
            currentIndex = 0; 
            updateCardDisplay();
            
            // 更新按鈕樣式
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            // 加入 150 毫秒的延遲後自動播放聲音
            setTimeout(() => { speak(1.0); }, 150);
        }

        function prevCard() {
            if (currentIndex > 0) currentIndex--; else currentIndex = vocabulary[currentTheme].length - 1;
            updateCardDisplay();
            setTimeout(() => { speak(1.0); }, 150);
        }

        function nextCard() {
            if (currentIndex < vocabulary[currentTheme].length - 1) currentIndex++; else currentIndex = 0;
            updateCardDisplay();
            setTimeout(() => { speak(1.0); }, 150);
        }

        function speak(speedRate, textOverride = null) {
            window.speechSynthesis.cancel();
            const textToSpeak = textOverride || vocabulary[currentTheme][currentIndex].es;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'es-ES'; utterance.rate = speedRate; 
            window.speechSynthesis.speak(utterance);
        }

        let quizScore = 0;
        let currentQuestionIndex = 0;
        const totalQuestions = 5;
        let currentQuizWord = null;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            switchView('view-quiz');
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('quiz-result').style.display = 'none';
            quizScore = 0;
            currentQuestionIndex = 0;
            loadNextQuestion();
        }

        function loadNextQuestion() {
            currentQuestionIndex++;
            document.getElementById('quiz-score-board').innerText = `目前分數: ${quizScore} / ${totalQuestions}`;
            
            if (currentQuestionIndex > totalQuestions) {
                document.getElementById('quiz-container').style.display = 'none';
                document.getElementById('quiz-result').style.display = 'block';
                document.getElementById('final-score-text').innerText = `你答對了 ${quizScore} 題！`;
                return;
            }

            const shuffledPool = shuffleArray([...allWordsPool]);
            currentQuizWord = shuffledPool[0];

            const emojiEl = document.getElementById('quiz-emoji');
            const targetEl = document.getElementById('quiz-target');
            emojiEl.classList.remove('animate-pop'); targetEl.classList.remove('animate-pop');
            void emojiEl.offsetWidth;
            emojiEl.classList.add('animate-pop'); targetEl.classList.add('animate-pop');

            emojiEl.innerText = currentQuizWord.emoji;
            targetEl.innerText = currentQuizWord.zh;

            let options = [currentQuizWord];
            for (let i = 1; i <= 3; i++) { options.push(shuffledPool[i]); }
            options = shuffleArray(options);

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = ''; 
            
            options.forEach(optionWord => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionWord.es;
                btn.onclick = () => handleAnswer(btn, optionWord.es === currentQuizWord.es, optionWord.es);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(btnElement, isCorrect, clickedSpanishWord) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            speak(1.0, clickedSpanishWord);

            if (isCorrect) {
                btnElement.classList.add('correct');
                quizScore++;
                document.getElementById('quiz-score-board').innerText = `目前分數: ${quizScore} / ${totalQuestions}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns.forEach(b => { if(b.innerText === currentQuizWord.es) b.classList.add('correct'); });
            }

            setTimeout(() => { loadNextQuestion(); }, 1500);
        }

        updateCardDisplay();
    </script>
</body>
</html>
